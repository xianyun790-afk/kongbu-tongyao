# Replace domain and certificate paths; this is a template, not a live deployment.
server {
    listen 443 ssl;
    server_name dm.example.com;
    ssl_certificate /etc/letsencrypt/live/dm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dm.example.com/privkey.pem;
    # The WebSocket invitation is in a query. Never log it.
    access_log off;
    location = /api/nia/status {
        proxy_pass http://127.0.0.1:4185;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/nia/dining-session {
        proxy_pass http://127.0.0.1:4185;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 650s;
        proxy_send_timeout 650s;
        proxy_buffering off;
    }
    location = /health { proxy_pass http://127.0.0.1:4185; }
    location / { return 404; }
}
